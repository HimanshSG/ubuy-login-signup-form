<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubuy Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="card">
        <h1 class="title">Welcome to Ubuy</h1>

        <!-- tabs -->
        <div class="tab-bar" id="tab-bar">
            <button class="tab active" data-tab="login">Log In</button>
            <button class="tab" data-tab="signup">Sign Up</button>
        </div>

        <!-- login form -->
        <form id="login-form" class="form active">
            <div class="field">
                <input type="email" id="login-email" placeholder="Email Address *" required>
            </div>
            <p class="error" id="login-email-error"></p>

            <div class="auth-row">
                <div class="mode-switch">
                    <button type="button" class="mode active" data-mode="password">Password</button>
                    <button type="button" class="mode" data-mode="otp">OTP</button>
                </div>

                <div class="field password-field">
                    <div class="input-wrap">
                        <input type="password" id="login-password" placeholder="Password *">
                        <span class="eye" id="toggle-login-pass">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <div class="otp-block hidden">
                    <div class="field otp-field">
                        <input type="text" id="login-otp" placeholder="OTP *">
                    </div>
                    <a href="#" class="get-otp" id="get-otp-login">Get OTP ?</a>
                </div>
            </div>
            <p class="error" id="login-pass-error"></p>

            <a href="#" class="forgot">Forgot Your Password?</a>

            <div class="recaptcha">
                <div class="recaptcha-left">
                    <input type="checkbox" id="login-captcha">
                    <span>I'm not a robot</span>
                </div>
                <div class="recaptcha-right">
                    <div class="logo">
                        <i class="fas fa-arrows-rotate"></i>
                    </div>
                    <div>reCAPTCHA</div>
                </div>
            </div>
            <p class="error" id="login-captcha-error"></p>

            <button type="submit" class="btn">Login</button>

            <button type="button" class="social">
                <i class="fab fa-google" style="color: crimson; font-size: 22px"></i>
                <i class="fab fa-facebook" style="color: royalblue; font-size: 22px"></i>
                <i class="fab fa-apple" style="color: black; font-size: 22px"></i>
                <i class="fab fa-paypal" style="color: navy; font-size: 22px"></i>
                <span>Login with Social Accounts</span>
            </button>
        </form>

        <!-- signup form -->
        <form id="signup-form" class="form">
            <div class="field">
                <input type="email" id="signup-email" placeholder="Email Address *" required>
            </div>
            <p class="error" id="signup-email-error"></p>

            <div class="auth-row">
                <div class="mode-switch">
                    <button type="button" class="mode active" data-mode="otp">OTP</button>
                    <button type="button" class="mode" data-mode="password">Password</button>
                </div>

                <div class="otp-block">
                    <div class="field otp-field">
                        <input type="text" id="signup-otp" placeholder="OTP *">
                    </div>
                    <a href="#" class="get-otp" id="get-otp-btn">Get OTP ?</a>
                </div>

                <div class="password-fields hidden">
                    <div class="field password-field">
                        <div class="input-wrap">
                            <input type="password" id="signup-password" placeholder="Password *">
                            <span class="eye" id="toggle-signup-pass">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                    </div>

                    <div class="field confirm-field">
                        <div class="input-wrap">
                            <input type="password" id="signup-confirm" placeholder="Confirm Password *">
                            <span class="eye" id="toggle-signup-confirm">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            <p class="error" id="signup-pass-error"></p>

            <label class="mailing">
                <input type="checkbox">
                <span>Join Our Mailing List- Get updates on Rollbacks, special pricing, hot new items, gift ideas and more.</span>
            </label>

            <div class="recaptcha">
                <div class="recaptcha-left">
                    <input type="checkbox" id="signup-captcha">
                    <span>I'm not a robot</span>
                </div>
                <div class="recaptcha-right">
                    <div class="logo">
                        <i class="fas fa-arrows-rotate"></i>
                    </div>
                    <div>reCAPTCHA</div>
                </div>
            </div>
            <p class="error" id="signup-captcha-error"></p>

            <button type="submit" class="btn">Register</button>

            <p class="terms">By continuing, you agree to Ubuy's <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a></p>

            <button type="button" class="social">
                <i class="fab fa-google" style="color: crimson; font-size: 22px"></i>
                <i class="fab fa-facebook" style="color: royalblue; font-size: 22px"></i>
                <i class="fab fa-apple" style="color: black; font-size: 22px"></i>
                <i class="fab fa-paypal" style="color: navy; font-size: 22px"></i>
                <span>Login with Social Accounts</span>
            </button>
        </form>

        <!-- welcome screen -->
        <div id="welcome-screen" class="welcome hidden">
            <h1>Welcome to Ubuy</h1>
            <p>You have successfully logged in.</p>
            <button type="button" id="logout-btn" class="btn">Logout</button>
        </div>
    </div>
</body>
</html>
